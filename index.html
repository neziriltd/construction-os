<body>
<nav id="rail"></nav>
<div class="wrap">
  <div class="top"><span class="row"><span id="net" class="net"></span><a href="#setup" style="text-decoration:none;font-size:1.2rem">⚙</a></span></div>
  <main id="main"></main>
</div>
<nav id="tabs"></nav>
<script>
/* ===== Shared core: storage (offline + cloud sync), AI, i18n, helpers ===== */
(function(){
  const LS = {
    get(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
  };
  const mem = {};
  const Store = {
    app: 'app', keys: [], data: {}, db: null, uid: null, cloud: false, timers: {}, listeners: [],
    async init(app, defaults){
      this.app = app; this.keys = Object.keys(defaults);
      for (const k of this.keys){
        const v = LS.get(app+':'+k);
        this.data[k] = (v !== null && v !== undefined) ? v : JSON.parse(JSON.stringify(defaults[k]));
      }
      this.connect();
      return this.data;
    },
    async connect(){
      try{
        if(!(window.claude && window.claude.use)) return;
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if(!db || !user) return;
        const id = await user.id();
        if(!id) return;
        this.db = db; this.uid = id;
        let any = false;
        for (const k of this.keys){
          try{
            const v = await this.pull(k);
            if (v !== undefined){ this.data[k] = v; LS.set(this.app+':'+k, v); any = true; }
            else { this.push(k); }
          }catch(e){ console.warn('db read', k, e); }
        }
        this.cloud = true;
        this.listeners.forEach(f=>{ try{ f(any); }catch(e){} });
      }catch(e){ console.warn('cloud unavailable', e); }
    },
    onCloud(f){ this.listeners.push(f); },
    save(k){
      const ok = LS.set(this.app+':'+k, this.data[k]);
      if (!ok && !this.db) toast('⚠️ Device storage is full — export a backup and remove some photos/files');
      if (!this.db) return;
      clearTimeout(this.timers[k]);
      this.timers[k] = setTimeout(()=>this.push(k), 800);
    },
    col(){ return this.db.collection('data/users/'+this.uid); },
    async pull(k){
      const meta = await this.col().doc(this.app+'_'+k).get();
      if (!meta || !meta.exists) return undefined;
      const m = meta.data();
      if (m.v !== undefined) return m.v;
      if (m.chunks){
        let str='';
        for (let i=0;i<m.chunks;i++){ const c = await this.col().doc(this.app+'_'+k+'__'+i).get(); if(!c.exists) return undefined; str += c.data().s; }
        return JSON.parse(str);
      }
      return undefined;
    },
    inflight:{}, again:{},
    async push(k){
      if(!this.db) return;
      if (this.inflight[k]){ this.again[k]=true; return; }
      this.inflight[k]=true;
      try{
        const str = JSON.stringify(this.data[k]);
        const SZ = 200000;
        if (str.length < SZ){ await this.col().doc(this.app+'_'+k).set({ v: this.data[k], t: Date.now() }); }
        else {
          const n = Math.ceil(str.length/SZ);
          for (let i=0;i<n;i++) await this.col().doc(this.app+'_'+k+'__'+i).set({ s: str.slice(i*SZ,(i+1)*SZ) });
          await this.col().doc(this.app+'_'+k).set({ chunks:n, t: Date.now() });
        }
      }catch(e){ console.warn('db write', k, e); toast(e && e.code==='quota_exceeded' ? 'Cloud storage full – kept on this device' : 'Cloud save failed – kept on this device'); }
      this.inflight[k]=false;
      if (this.again[k]){ this.again[k]=false; this.push(k); }
    },
    saveAll(){ this.keys.forEach(k=>this.save(k)); }
  };

  async function askAI(prompt, onText){
    try{
      if (window.claude && window.claude.use){
        const sample = await window.claude.use('sample');
        if (sample){
          const r = await sample(prompt, { onText: onText ? (p)=>onText(p.text) : undefined, cache:false });
          return r.text;
        }
      }
    }catch(e){
      if (e && e.code === 'rate_limited') return '⚠️ AI is busy – please try again in a minute.';
      if (e && e.code === 'not_granted') return '⚠️ AI permission was not granted.';
      console.warn(e);
    }
    return null; // caller falls back to offline logic
  }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDate(t){ try{ return new Date(t).toLocaleString(I18N.lang==='sq'?'sq-AL':undefined,{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return new Date(t).toISOString(); } }
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.from((r||document).querySelectorAll(s)); }
  function toast(msg){
    let t = document.getElementById('toast');
    if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
    t.textContent = msg; t.className='show';
    clearTimeout(t._h); t._h=setTimeout(()=>t.className='',2600);
  }
  function modal(html, onMount){
    const m = document.createElement('div'); m.className='modal-bg';
    m.innerHTML = '<div class="modal"><button class="modal-x" aria-label="Close">✕</button>'+html+'</div>';
    document.body.appendChild(m);
    const close=()=>m.remove();
    m.querySelector('.modal-x').onclick=close;
    m.addEventListener('click',e=>{ if(e.target===m) close(); });
    if(onMount) onMount(m.querySelector('.modal'), close);
    return close;
  }
  function confirmBox(msg){
    return new Promise(res=>{
      modal('<h3>'+esc(msg)+'</h3><div class="row end"><button class="btn ghost" data-n>'+t('cancel')+'</button><button class="btn danger" data-y>'+t('confirm')+'</button></div>',(el,close)=>{
        el.querySelector('[data-n]').onclick=()=>{close();res(false);};
        el.querySelector('[data-y]').onclick=()=>{close();res(true);};
      });
    });
  }
  function resizeImage(file, max){
    max = max||900;
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const s = Math.min(1, max/Math.max(img.width,img.height));
          const c = document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',0.62));
        };
        img.onerror=rej; img.src=r.result;
      };
      r.onerror=rej; r.readAsDataURL(file);
    });
  }
  async function copyText(txt){
    try{ await navigator.clipboard.writeText(txt); toast(t('copied')); }
    catch(e){
      modal('<h3>'+t('copyManual')+'</h3><textarea style="width:100%;height:240px">'+esc(txt)+'</textarea>');
    }
  }
  async function downloadFile(filename, data){
    try{
      if (window.claude && window.claude.use){
        const d = await window.claude.use('downloads');
        if (d){ await d.save({filename, data}); return; }
      }
    }catch(e){ if(e && e.code) { toast(e.message||'Download declined'); return; } }
    try{
      const blob = new Blob([data],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ copyText(data); }
  }

  // i18n
  const I18N = { lang:'en', dict:{en:{},sq:{}}, names:{en:'English',sq:'Shqip'} };
  function t(k){ const d=I18N.dict[I18N.lang]||{}; return d[k]!==undefined?d[k]:(I18N.dict.en[k]!==undefined?I18N.dict.en[k]:k); }
  function detectLang(saved){
    if (saved && I18N.dict[saved]) return saved;

  // AI translation of the whole interface into any language (cached by the app)
  async function aiTranslateDict(code, langName){

    try{ const j = JSON.parse(out.slice(out.indexOf('{'), out.lastIndexOf('}')+1)); return j; }catch(e){ return null; }
  }
  const LANGS = {en:'English',sq:'Shqip (Albanian)',it:'Italiano',de:'Deutsch',fr:'Français',es:'Español',pt:'Português',el:'Ελληνικά',tr:'Türkçe',ro:'Română',pl:'Polski',nl:'Nederlands',ru:'Русский',uk:'Українська',ar:'العربية',hi:'हिन्दी',ur:'اردو',bn:'বাংলা',zh:'中文',ja:'日本語',ko:'한국어',sw:'Kiswahili',sr:'Srpski',hr:'Hrvatski',bg:'Български',mk:'Македонски',hu:'Magyar',cs:'Čeština',sv:'Svenska',no:'Norsk',da:'Dansk',fi:'Suomi',he:'עברית',fa:'فارسی',id:'Bahasa Indonesia',ms:'Bahasa Melayu',th:'ไทย',vi:'Tiếng Việt',tl:'Filipino',pa:'ਪੰਜਾਬੀ',ta:'தமிழ்',am:'አማርኛ',yo:'Yorùbá',ha:'Hausa',zu:'isiZulu'};
  window.aiTranslateDict = aiTranslateDict; window.LANGS = LANGS;
  // settings: object persisted by the app (needs .lang, .customLangs); saveFn persists it
  async function applyLang(code, settings, saveFn){
    settings.customLangs = settings.customLangs || {};
    Object.keys(settings.customLangs).forEach(c=>{ I18N.dict[c]=settings.customLangs[c]; I18N.names[c]=LANGS[c]||c; });
    if (!I18N.dict[code]){
      toast('🌍 Translating to '+(LANGS[code]||code)+'…');
      const d = await aiTranslateDict(code, LANGS[code]||code);
      if (!d){ toast('Translation needs the AI connection — showing English for now'); code='en'; }
      else { settings.customLangs[code]=d; I18N.dict[code]=d; I18N.names[code]=LANGS[code]||code; }
    }
    I18N.lang = code; settings.lang = code; saveFn && saveFn();
    document.documentElement.lang = code;
    document.documentElement.dir = ['ar','he','fa','ur'].includes(code) ? 'rtl' : 'ltr';
    return code;
  }
  function langOptions(cur){ return Object.keys(LANGS).map(c=>'<option value="'+c+'"'+(c===cur?' selected':'')+'>'+LANGS[c]+(I18N.dict[c]?'':' ✨')+'</option>').join(''); }
  function deviceLang(settings){
    if (settings && settings.lang) return settings.lang;
    const nl=(navigator.language||'en').slice(0,2).toLowerCase();
    return LANGS[nl] ? nl : 'en';
  }
  window.applyLang=applyLang; window.langOptions=langOptions; window.deviceLang=deviceLang;

  // online / offline indicator
  function netBadge(el){

    window.addEventListener('online',()=>{upd(); if(Store.db) Store.saveAll();});
    window.addEventListener('offline',upd);
    Store.onCloud(upd);

/* ===== Shared dynamic form engine (render / read / view) + signature pad ===== */
(function(){
  function tl(x){ if (Array.isArray(x)) return (I18N.lang==='sq' && x[1]) ? x[1] : x[0]; return x==null?'':String(x); }

  function sigPad(canvas){
    const ctx = canvas.getContext('2d');
    const ratio = 2;
    function fit(){ const w=canvas.clientWidth||320, h=canvas.clientHeight||130; canvas.width=w*ratio; canvas.height=h*ratio; ctx.scale(ratio,ratio); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#111'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); }
    fit();
    let drawing=false, dirty=false, last=null;
    const pos=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
    canvas.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e); canvas.setPointerCapture(e.pointerId); e.preventDefault(); });
    canvas.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; dirty=true; e.preventDefault(); });
    const end=()=>{ drawing=false; };
    canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
    return { clear(){ ctx.setTransform(1,0,0,1,0,0); fit(); dirty=false; }, value(){ return dirty ? canvas.toDataURL('image/png') : ''; }, get dirty(){return dirty;} };
  }

  // render editable form
  function renderForm(container, fields, values){
    values = values||{};
    const pads = {};
    container.innerHTML = fields.map(f=>{
      const id='f_'+f.id, req=f.required?' <span class="req">*</span>':'';
      const lab='<label for="'+id+'">'+esc(tl(f.label))+req+'</label>';
      const v = values[f.id];
      switch(f.type){
        case 'heading': return '<h4 class="f-head">'+esc(tl(f.label))+'</h4>';
        case 'textarea': return '<div class="field">'+lab+'<textarea id="'+id+'" rows="3">'+esc(v||'')+'</textarea>'+(f.ai?'<button type="button" class="btn sm ai-btn" data-ai="'+f.id+'">✨ '+t('aiDraft')+'</button>':'')+'</div>';
        case 'number': return '<div class="field">'+lab+'<input id="'+id+'" type="number" value="'+esc(v||'')+'"></div>';
        case 'date': return '<div class="field">'+lab+'<input id="'+id+'" type="date" value="'+esc(v||new Date().toISOString().slice(0,10))+'"></div>';
        case 'datetime': return '<div class="field">'+lab+'<input id="'+id+'" type="datetime-local" value="'+esc(v||'')+'"></div>';
        case 'select': return '<div class="field">'+lab+'<select id="'+id+'"><option value="">—</option>'+(f.options||[]).map(o=>'<option'+(tl(o)===v?' selected':'')+'>'+esc(tl(o))+'</option>').join('')+'</select></div>';
        case 'multi': return '<div class="field">'+lab+'<div class="chips" id="'+id+'">'+(f.options||[]).map(o=>'<label class="chip"><input type="checkbox" value="'+esc(tl(o))+'"'+((v||[]).includes(tl(o))?' checked':'')+'> '+esc(tl(o))+'</label>').join('')+'</div></div>';
        case 'yesno': return '<div class="field">'+lab+'<div class="seg" id="'+id+'">'+['Yes','No','N/A'].map(o=>'<label><input type="radio" name="'+id+'" value="'+o+'"'+(v===o?' checked':'')+'><span>'+t(o)+'</span></label>').join('')+'</div></div>';
        case 'checklist': return '<div class="field">'+lab+'<div class="checklist" id="'+id+'">'+(f.items||[]).map((it,i)=>{ const cv=(v||{})[i]; return '<div class="cl-row"><span>'+esc(tl(it))+'</span><div class="seg">'+['Yes','No','N/A'].map(o=>'<label><input type="radio" name="'+id+'_'+i+'" value="'+o+'"'+(cv===o?' checked':'')+'><span>'+t(o)+'</span></label>').join('')+'</div></div>'; }).join('')+'</div></div>';
        case 'photo': return '<div class="field">'+lab+'<input id="'+id+'" type="file" accept="image/*" multiple><div class="thumbs" id="'+id+'_th">'+(v||[]).map(s=>'<img src="'+s+'">').join('')+'</div></div>';
        case 'signature': return '<div class="field">'+lab+'<canvas class="sig" id="'+id+'"></canvas><button type="button" class="btn sm ghost" data-clear="'+f.id+'">'+t('clear')+'</button>'+(v?'<div class="muted small">'+t('signedAlready')+'</div>':'')+'</div>';
        case 'signoff': return '<div class="field">'+lab+'<div class="signoff" id="'+id+'"><div class="so-list">'+(v||[]).map(s=>'<div class="so-item"><img src="'+s.sig+'"><span>'+esc(s.name)+'</span></div>').join('')+'</div><div class="row"><input placeholder="'+t('name')+'" class="so-name"><canvas class="sig small"></canvas></div><div class="row"><button type="button" class="btn sm" data-soadd>'+t('addSignature')+'</button><button type="button" class="btn sm ghost" data-soclear>'+t('clear')+'</button></div></div></div>';
        default: return '<div class="field">'+lab+'<input id="'+id+'" type="text" value="'+esc(v||'')+'"></div>';
      }
    }).join('');
    // wire photos
    const photos = {};
    fields.filter(f=>f.type==='photo').forEach(f=>{
      photos[f.id] = (values[f.id]||[]).slice();
      const inp = container.querySelector('#f_'+f.id);
      inp.onchange = async ()=>{
        for (const file of inp.files){ try{ const d=await resizeImage(file,900); photos[f.id].push(d); container.querySelector('#f_'+f.id+'_th').insertAdjacentHTML('beforeend','<img src="'+d+'">'); }catch(e){ toast('Image failed'); } }
        inp.value='';
      };
    });
    fields.filter(f=>f.type==='signature').forEach(f=>{
      pads[f.id] = sigPad(container.querySelector('#f_'+f.id));
      container.querySelector('[data-clear="'+f.id+'"]').onclick=()=>pads[f.id].clear();
    });
    const signoffs = {};
    fields.filter(f=>f.type==='signoff').forEach(f=>{
      signoffs[f.id] = (values[f.id]||[]).slice();
      const box = container.querySelector('#f_'+f.id);
      const pad = sigPad(box.querySelector('canvas'));
      box.querySelector('[data-soclear]').onclick=()=>pad.clear();
      box.querySelector('[data-soadd]').onclick=()=>{
        const name = box.querySelector('.so-name').value.trim();
        if(!name || !pad.dirty){ toast(t('nameAndSign')); return; }
        const s={name, sig:pad.value(), at:Date.now()}; signoffs[f.id].push(s);
        box.querySelector('.so-list').insertAdjacentHTML('beforeend','<div class="so-item"><img src="'+s.sig+'"><span>'+esc(name)+'</span></div>');
        box.querySelector('.so-name').value=''; pad.clear();
      };
    });
    return {
      read(){
        const out={}; const missing=[];
        fields.forEach(f=>{
          const el = container.querySelector('#f_'+f.id);
          let v;
          switch(f.type){
            case 'heading': return;
            case 'multi': v=$$('input:checked',el).map(i=>i.value); break;
            case 'yesno': { const c=container.querySelector('input[name="f_'+f.id+'"]:checked'); v=c?c.value:''; break; }
            case 'checklist': v={}; (f.items||[]).forEach((it,i)=>{ const c=container.querySelector('input[name="f_'+f.id+'_'+i+'"]:checked'); if(c) v[i]=c.value; }); break;
            case 'photo': v=photos[f.id]; break;
            case 'signature': v=pads[f.id].value() || (values[f.id]||''); break;
            case 'signoff': v=signoffs[f.id]; break;
            default: v=el.value.trim();
          }
          const empty = v===''||v==null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
          if (f.required && empty) missing.push(tl(f.label));
          out[f.id]=v;
        });
        return {values:out, missing};
      },
      set(fid, val){ const el=container.querySelector('#f_'+fid); if(el) el.value=val; }
    };
  }

  function viewRecord(fields, values){
    return '<div class="rec-view">'+fields.map(f=>{
      const v = values[f.id];
      if (f.type==='heading') return '<h4 class="f-head">'+esc(tl(f.label))+'</h4>';
      let body='';
      if (f.type==='photo') body = (v||[]).map(s=>'<img class="ph" src="'+s+'">').join('') || '<span class="muted">—</span>';
      else if (f.type==='signature') body = v ? '<img class="sigimg" src="'+v+'">' : '<span class="muted">—</span>';
      else if (f.type==='signoff') body = (v||[]).map(s=>'<div class="so-item"><img src="'+s.sig+'"><span>'+esc(s.name)+' · '+fmtDate(s.at)+'</span></div>').join('') || '<span class="muted">—</span>';
      else if (f.type==='checklist') body = '<table class="cl-tbl">'+(f.items||[]).map((it,i)=>{ const a=(v||{})[i]||'—'; return '<tr><td>'+esc(tl(it))+'</td><td class="ans '+String(a).replace('/','').toLowerCase()+'">'+esc(t(a))+'</td></tr>'; }).join('')+'</table>';
      else if (Array.isArray(v)) body = v.length? esc(v.join(', ')) : '<span class="muted">—</span>';
      else if (f.type==='yesno') body = v? esc(t(v)) : '—';
      else if (f.type==='datetime') body = v? esc(String(v).replace('T',' ')) : '—';
      else body = v ? esc(v).replace(/\n/g,'<br>') : '<span class="muted">—</span>';
      return '<div class="rv-row"><div class="rv-l">'+esc(tl(f.label))+'</div><div class="rv-v">'+body+'</div></div>';
    }).join('')+'</div>';
  }

  function recordText(fields, values){
    return fields.filter(f=>!['photo','signature','heading'].includes(f.type)).map(f=>{
      let v=values[f.id];
      if (f.type==='checklist') v=(f.items||[]).map((it,i)=>'  - '+tl(it)+': '+((v||{})[i]||'—')).join('\n');
      else if (f.type==='signoff') v=(v||[]).map(s=>s.name).join(', ');
      else if (Array.isArray(v)) v=v.join(', ');
      return tl(f.label)+': '+(v||'—');
    }).join('\n');
  }

  function checklistScore(fields, values){
    let yes=0,no=0;
    fields.filter(f=>f.type==='checklist').forEach(f=>{ Object.values(values[f.id]||{}).forEach(a=>{ if(a==='Yes')yes++; else if(a==='No')no++; }); });
    return {yes,no};
  }

  Object.assign(window,{tl,sigPad,renderForm,viewRecord,recordText,checklistScore});
})();

},
setup(m){
  m.innerHTML='<div class="grid g2"><div class="card"><h3>'+t('profile')+'</h3><div class="row">'+avatar(me(),S.profile.avatar,64)+'<label class="btn ghost sm">'+t('avatar')+'<input type="file" id="av" accept="image/*" hidden></label></div><div class="field" style="margin-top:.8rem"><label>'+t('displayName')+'</label><input id="pn" value="'+esc(S.profile.name)+'"></div><div class="field"><label>'+t('bio')+'</label><textarea id="pb" rows="2">'+esc(S.profile.bio)+'</textarea></div><button class="btn" id="ps">'+t('save')+'</button></div>'+
   '<div class="card"><h3>🌍 '+t('language')+'</h3><select id="sl">'+langOptions(I18N.lang)+'</select><button class="btn ghost sm" id="sdev" style="margin-top:.6rem">'+t('followDevice')+'</button><div class="muted small" style="margin-top:.4rem">✨ = translated by AI on first use</div><h3 style="margin-top:1.2rem">💾 Backup</h3><div class="row"><button class="btn ghost" id="ex">⬇ '+t('exportData')+'</button><label class="btn ghost">⬆ '+t('importData')+'<input type="file" id="im" accept=".json" hidden></label></div><button class="btn danger sm" id="rs" style="margin-top:1rem">'+t('resetData')+'</button></div>'+
   '<div class="card"><h3>UniVerse-OS™</h3><div class="small muted">Version 1.0 · © '+new Date().getFullYear()+' Saimir Neziri. All rights reserved. Proprietary software.</div></div></div>';
  let av=S.profile.avatar;
  $('#av').onchange=async e=>{ av=await resizeImage(e.target.files[0],256); S.profile.avatar=av; Store.save('profile'); V.setup(m); };
  $('#ps').onclick=()=>{ S.profile.name=$('#pn').value.trim(); S.profile.bio=$('#pb').value.trim(); Store.save('profile'); toast(t('saved')); };
  $('#sl').onchange=async e=>{ await applyLang(e.target.value,S.settings,()=>Store.save('settings')); route(); };
  $('#sdev').onclick=async()=>{ S.settings.lang=null; await applyLang(deviceLang(S.settings),S.settings,()=>Store.save('settings')); route(); };
  $('#ex').onclick=()=>{ const o={}; Store.keys.forEach(k=>o[k]=S[k]); downloadFile('universe-backup.json',JSON.stringify(o)); };
  $('#im').onchange=async e=>{ try{ const d=JSON.parse(await e.target.files[0].text()); Store.keys.forEach(k=>{ if(d[k]!==undefined){ S[k]=d[k]; Store.save(k);} }); route(); }catch(er){ toast('Invalid file'); } };
  $('#rs').onclick=async()=>{ if(!await confirmBox(t('resetData')+'?')) return; Object.keys(DEFAULTS).forEach(k=>{ S[k]=JSON.parse(JSON.stringify(DEFAULTS[k])); Store.save(k); }); route(); };
}
};

function route(){ const h=(location.hash||'#home').slice(1); st.view=V[h]?h:'home'; chrome(); $('#main').className='v-'+st.view; V[st.view]($('#main')); window.scrollTo(0,0); }
(async function(){
  S=await Store.init('uni',DEFAULTS);
  await applyLang(deviceLang(S.settings),S.settings,()=>Store.save('settings'));
  netBadge($('#net'));
  window.addEventListener('hashchange',route);
  Store.onCloud(async()=>{ await applyLang(deviceLang(S.settings),S.settings); route(); });
  route();
})();

</script>
<script src="/install.js" data-accent="#7c5cff" data-name="UniVerse-OS" defer></script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});</script>
